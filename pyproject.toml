[project]
name = "movie-reservation-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "basedpyright>=1.40.1",
    "black>=26.5.1",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyrefly>=0.45.0",
    "ruff>=0.16.6",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "jwt>=1.4.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    "python-json-logger>=4.2.0",
    "aioredis>=2.0.1",
    "redis>=8.1.0",
]

[dependency-groups]
test = [
    "aiosqlite>=0.21.0",
    "httpx2>=1.0.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src/app"]
testpaths = ["src/test"]
